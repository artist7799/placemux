version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: placemux-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: placemux_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: placemux-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/placemux_db?schema=public
      JWT_SECRET: placemux_prod_access_secret_jwt_2026
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_SECRET: placemux_prod_refresh_secret_jwt_2026
      REFRESH_TOKEN_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: placemux-ai-service
    restart: always
    ports:
      - '8000:8000'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: placemux-frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  postgres_data:
